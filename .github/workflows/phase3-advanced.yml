# Phase 3 — koristi Ballchasing free download limit (~200/h)
# Jedan run = do BATCH_SIZE replay-a (default 180), schedule svaki sat.

name: Phase3 Advanced Replays

on:
  schedule:
    # Svaki sat, u :20 (UTC) — jedan veliki batch po satu
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Koliko replay-a u ovom runu (max 200, preporuka 180)"
        required: false
        default: "180"
      reprocess_empty:
        description: "Ponovo obradi mečeve bez heatmap/frame podataka (1=da)"
        required: false
        default: "1"

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: phase3/worker/requirements.txt

      - name: Install rrrocket (up-to-date boxcars CLI)
        run: |
          set -e
          VER=0.11.5
          URL="https://github.com/nickbabcock/rrrocket/releases/download/v${VER}/rrrocket-${VER}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$URL" -o /tmp/rrrocket.tgz
          tar -xzf /tmp/rrrocket.tgz -C /tmp
          BIN=$(find /tmp -type f -name rrrocket | head -1)
          sudo install -m 755 "$BIN" /usr/local/bin/rrrocket
          rrrocket --help | head -3
          echo "rrrocket installed: $(which rrrocket)"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0" "numpy>=1.24.0"
          # optional fallback (often lagging behind RL patches)
          pip install "sprocket-boxcars-py>=0.3.0" || echo "WARN: sprocket-boxcars-py missing (rrrocket is primary)"
          python - <<'PY'
          import shutil, subprocess
          bin = shutil.which("rrrocket")
          print("rrrocket:", bin)
          if not bin:
              raise SystemExit("ERROR: rrrocket not on PATH")
          print("rrrocket OK")
          PY

      - name: Run worker
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
          HOST_BASE_URL: ${{ secrets.HOST_BASE_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '180' }}
          REPROCESS_EMPTY: ${{ github.event.inputs.reprocess_empty || '1' }}
        run: |
          python phase3/worker/worker.py

      - name: Cleanup workspace replays (safety)
        if: always()
        run: |
          find /tmp -name '*.replay' -delete 2>/dev/null || true
          find . -name '*.replay' -delete 2>/dev/null || true

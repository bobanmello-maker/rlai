# Phase 3 — koristi Ballchasing free download limit (~200/h)
# Jedan run = do BATCH_SIZE replay-a (default 180), schedule svaki sat.

name: Phase3 Advanced Replays

on:
  schedule:
    # Svaki sat, u :20 (UTC) — jedan veliki batch po satu
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Koliko replay-a u ovom runu (max 200, preporuka 180)"
        required: false
        default: "180"

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 175

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: phase3/worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r phase3/worker/requirements.txt

      - name: Run worker
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
          HOST_BASE_URL: ${{ secrets.HOST_BASE_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '180' }}
        run: |
          python phase3/worker/worker.py

      - name: Cleanup workspace replays (safety)
        if: always()
        run: |
          find /tmp -name '*.replay' -delete 2>/dev/null || true
          find . -name '*.replay' -delete 2>/dev/null || true
